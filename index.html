<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión 10 IA · Estación 4</title><style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1e3678,#090f26 60%);color:#fff}main{max-width:720px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border:1px solid #5de8ff;border-radius:99px;padding:9px 13px;color:#72ecff;font-weight:800}.hero{text-align:center;margin:26px 0}.hero h1{font-size:clamp(2rem,7vw,3.4rem);margin:8px 0;color:#ffe16c}.hero p{color:#c9d7ff}.card{background:#151f43;border:1px solid #5265a2;border-radius:22px;padding:24px;box-shadow:0 14px 40px #0006}h2{margin-top:0}.prompt{font-size:1.16rem;line-height:1.55}.visual{background:#07152e;border:1px dashed #6ac4d9;border-radius:16px;padding:18px;text-align:center;font-size:clamp(1.1rem,4vw,1.7rem);font-weight:900;letter-spacing:.05em;white-space:pre-wrap;margin:18px 0}.choices{display:grid;gap:11px}.choice{border:1px solid #6b81c7;background:#243468;color:white;border-radius:13px;padding:15px;text-align:left;font-size:1rem;cursor:pointer}.choice.selected{border-color:#ffe16c;background:#514a76}.choice:disabled{cursor:default}.btn{display:block;width:100%;background:#ffce36;color:#11183c;border:0;border-radius:13px;padding:15px;font-size:1.05rem;font-weight:900;cursor:pointer;margin-top:16px}.btn:disabled{opacity:.5;cursor:not-allowed}input{width:100%;padding:14px;border-radius:12px;background:#09142e;border:1px solid #8ba8eb;color:#fff;font-size:1.1rem}.feedback{border-radius:12px;padding:15px;margin-top:16px;background:#0d3b4d;line-height:1.5}.small{font-size:.9rem;color:#bdcbea}footer{text-align:center;margin-top:24px;color:#a5b8e7;font-size:.84rem}</style></head><body><main><div class="head"><span class="pill">⚡ MISIÓN 04</span><span class="pill" id="score">🏆 0 PTS</span></div><header class="hero"><div style="font-size:3rem">🤖 🧩 🛰️</div><h1>RESCATE DIGITAL</h1><p>Cinco desafíos de algoritmos, rutas y pensamiento computacional</p></header><section id="app" class="card" aria-live="polite"></section><footer>Misión 10 IA · Estación 4 · Cada respuesta correcta suma 20 puntos</footer></main><script>
const ENDPOINT='https://script.google.com/a/macros/iedigital.edu.co/s/AKfycbyrz9NVJT-lpTcXlXuVYs06Mu8JpsyChqn8I6Hn9VjhsQ9nnM9zUJrZ4cArkg-guu8/exec';
const QUESTIONS=[
{title:'El robot mensajero',prompt:'El robot empieza mirando al norte. Ejecuta: avanzar 2, girar a la derecha, avanzar 3, girar a la derecha, avanzar 1. ¿Dónde termina respecto al inicio?',visual:'↑ 2  → 3  ↓ 1',options:['3 al este y 1 al norte','3 al oeste y 1 al norte','3 al este y 3 al norte','1 al este y 3 al norte'],answer:0,why:'El movimiento neto es 2−1=1 al norte y 3 al este.'},
{title:'Depuración del sistema',prompt:'Un programa ejecuta este pseudocódigo. ¿Qué número imprime?',visual:'x = 2\nREPETIR 3 VECES:\n  x = x * 2 + 1\nIMPRIMIR x',options:['15','17','23','31'],answer:2,why:'Partiendo de 2: 5, luego 11 y finalmente 23.'},
{title:'Ruta de menor costo',prompt:'Debes ir de A a D. Las conexiones son A→B=4, A→C=7, B→C=1, B→D=8, C→D=3. ¿Cuál es el costo mínimo?',visual:'A→B 4     A→C 7\nB→C 1     B→D 8\nC→D 3',options:['7','8','9','10'],answer:1,why:'A→B→C→D cuesta 4+1+3=8.'},
{title:'Puertas lógicas',prompt:'Una alarma se activa si (A Y B) O (NO C). Si A=1, B=0 y C=1, ¿se activa?',visual:'(A AND B) OR (NOT C)',options:['Sí, porque A vale 1','Sí, porque C vale 1','No, el resultado es 0','No se puede determinar'],answer:2,why:'1 AND 0 = 0 y NOT 1 = 0; por tanto 0 OR 0 = 0.'},
{title:'Código binario',prompt:'Una cerradura pide el número decimal correspondiente a 10110 en binario. ¿Qué ingresas?',visual:'1 0 1 1 0₂',options:['20','21','22','26'],answer:2,why:'16 + 4 + 2 = 22.'}
];
let team='',index=-1,selected=null,confirmed=false,answers=[],attemptId='',sent=false;
const app=document.getElementById('app'),scoreEl=document.getElementById('score');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const score=()=>answers.reduce((n,a,i)=>n+(a===QUESTIONS[i].answer?20:0),0);
function newId(){return 'M10-04-'+Date.now()+'-'+Math.random().toString(36).slice(2,12)}
function submitResult(){if(sent)return;sent=true;const data=new URLSearchParams({equipo:team,estacion:'04',puntos:String(score()),id:attemptId});const iframe=document.createElement('iframe');iframe.name='m10_result_frame';iframe.style.display='none';document.body.appendChild(iframe);const form=document.createElement('form');form.method='POST';form.action=ENDPOINT;form.target=iframe.name;form.style.display='none';for(const [k,v] of data){const input=document.createElement('input');input.name=k;input.value=v;form.appendChild(input)}document.body.appendChild(form);form.submit();setTimeout(()=>{form.remove();iframe.remove()},12000)}
function render(){scoreEl.textContent='🏆 '+score()+' PTS';if(index===-1){app.innerHTML='<h2>🚀 Iniciar misión</h2><p>Trabajen en equipo y resuelvan cinco desafíos. Cada respuesta correcta suma 20 puntos.</p><label for="team">Código del equipo</label><input id="team" maxlength="7" placeholder="M10-001" autocomplete="off"><button class="btn" id="start">COMENZAR MISIÓN</button><p class="small">Solo códigos M10-001 a M10-020. El resultado se envía al registro al finalizar.</p>';document.getElementById('start').onclick=()=>{const t=document.getElementById('team').value.trim().toUpperCase();if(!/^M10-0(0[1-9]|1[0-9]|20)$/.test(t)){alert('Escribe un código válido entre M10-001 y M10-020');return}team=t;index=0;attemptId=newId();sent=false;render()};return}
if(index===QUESTIONS.length){app.innerHTML='<h2>🏆 ¡MISIÓN COMPLETADA!</h2><div class="visual">'+score()+' / 100 PUNTOS</div><p>Equipo <b>'+esc(team)+'</b> · '+score()/20+' respuestas correctas.</p><p class="feedback">📡 Resultado enviado al receptor de Google Sheets. Pide al organizador verificar el registro.</p><button class="btn" id="again">VOLVER A JUGAR</button>';submitResult();document.getElementById('again').onclick=()=>{team='';index=-1;selected=null;confirmed=false;answers=[];attemptId='';sent=false;render()};return}
const q=QUESTIONS[index];app.innerHTML='<p class="small">RETO '+(index+1)+' DE 5</p><h2>'+esc(q.title)+'</h2><p class="prompt">'+esc(q.prompt)+'</p><div class="visual">'+esc(q.visual)+'</div><div class="choices">'+q.options.map((o,i)=>'<button class="choice'+(selected===i?' selected':'')+'" data-choice="'+i+'" '+(confirmed?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div><button class="btn" id="next" '+(selected===null?'disabled':'')+'>'+(confirmed?'SIGUIENTE RETO':'CONFIRMAR RESPUESTA')+'</button>'+(confirmed?'<div class="feedback"><b>'+(selected===q.answer?'✅ ¡Correcto!':'❌ Respuesta incorrecta')+'</b><p>'+esc(q.why)+'</p></div>':'');
app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(confirmed)return;selected=Number(b.dataset.choice);render()});document.getElementById('next').onclick=()=>{if(selected===null)return;if(!confirmed){confirmed=true;answers.push(selected);render()}else{index++;selected=null;confirmed=false;render()}}}
render();
</script></body></html>
